[build]
  command = "# no build command"
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["net"]
  included_files = []
  timeout = 30

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/vless"
  status = 200
  force = true
